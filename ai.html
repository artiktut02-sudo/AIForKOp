<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForKop AI // Neural Terminal</title>
    <style>
        :root { --primary: #4af626; --bg: #050505; --glow: 0 0 8px rgba(74, 246, 38, 0.4); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; background: var(--bg); color: var(--primary); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        header { 
            padding: 20px; text-align: center; border-bottom: 1px solid var(--primary); text-shadow: var(--glow); 
        }
        h1 { letter-spacing: 3px; font-size: 1.8rem; }
        .status { font-size: 0.8rem; opacity: 0.7; margin-top: 5px; }
        
        #chat-container { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; 
        }
        .message { 
            max-width: 85%; padding: 12px 18px; border-radius: 5px; line-height: 1.5; 
            animation: fadeIn 0.3s ease; white-space: pre-wrap; word-break: break-word; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-msg { align-self: flex-end; background: rgba(74, 246, 38, 0.1); border: 1px solid var(--primary); }
        .ai-msg { align-self: flex-start; background: rgba(0, 0, 0, 0.8); border: 1px dashed var(--primary); color: #aaffaa; }
        
        #input-area { 
            padding: 20px; border-top: 1px solid var(--primary); display: flex; gap: 10px; background: var(--bg); 
        }
        input { 
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--primary); color: var(--primary); 
            padding: 12px; font-family: inherit; outline: none; 
        }
        button { 
            background: var(--primary); color: var(--bg); border: none; padding: 0 25px; 
            font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.3s; 
        }
        button:hover { box-shadow: var(--glow); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        footer { text-align: center; padding: 5px; font-size: 0.7rem; opacity: 0.4; cursor: pointer; }
        body.god-mode { --primary: #ff00de; --bg: #1a001a; }
    </style>
</head>
<body>
    <header>
        <h1>ForKop AI // NEURAL TERMINAL</h1>
        <div class="status">SYSTEM: ONLINE | MODEL: LLAMA-3-70B | LATENCY: REAL-TIME</div>
    </header>

    <div id="chat-container">
        <div class="message ai-msg">> ForKop AI initialized.<br>> Connected to Groq Llama-3 Core.<br>> Awaiting operator input...</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Enter command or question..." autocomplete="off">
        <button id="sendBtn">EXECUTE</button>
    </div>

    <footer id="secretFooter">Dev: KISUNE | ForKop AI Protocol</footer>

    <script>
        // 🔑 ТВОЙ КЛЮЧ УЖЕ ЗДЕСЬ, БРАТ!
        const GROQ_API_KEY = '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'; 
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Системный промпт для хакерского стиля
        let messages = [
            { role: "system", content: "You are ForKop AI, a hacker-style terminal assistant created by KISUNE. Keep answers short, technical, and in character. Always start responses with '>' symbol. Never break character." }
        ];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            messages.push({ role: "user", content: text });
            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = "PROCESSING...";

            const loadingId = addMessage('> Thinking...', 'ai-msg typing-indicator');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-70b-8192",
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiText = data.choices[0].message.content;
                    addMessage(aiText, 'ai-msg');
                    messages.push({ role: "assistant", content: aiText });
                } else {
                    addMessage('> ERROR: Connection failed. Check key.', 'ai-msg');
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage(`> SYSTEM FAILURE: ${error.message}`, 'ai-msg');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "EXECUTE";
                userInput.focus();
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.id = 'msg-' + Date.now();
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.id;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // God Mode Secret
        let clicks = 0;
        document.getElementById('secretFooter').addEventListener('click', () => {
            clicks++;
            if (clicks === 5) document.body.classList.add('god-mode');
        });
    </script>
</body>
</html>
